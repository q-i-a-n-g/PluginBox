<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>插件盒子</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 230px;
      padding: 18px;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #1b1d20;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 8px;
    }
    .tool {
      min-width: 0;
      height: 96px;
      border: 0;
      border-radius: 14px;
      background: transparent;
      color: #e5e7eb;
      cursor: pointer;
      display: grid;
      grid-template-rows: 46px 34px;
      place-items: center;
      align-content: center;
      gap: 8px;
      font: inherit;
    }
    .tool:hover { background: rgba(255,255,255,.07); }
    .icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 23px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,.24);
    }
    .links { background: conic-gradient(from 180deg, #22c55e, #38bdf8, #f59e0b, #22c55e); }
    .images { background: linear-gradient(135deg, #22c55e, #0ea5e9); }
    .eval { background: linear-gradient(135deg, #f43f5e, #8b5cf6); }
    .weekly { background: linear-gradient(135deg, #f59e0b, #16a34a); }
    .name {
      width: 100%;
      color: #d8dee8;
      font-size: 12px;
      line-height: 1.25;
      text-align: center;
      min-height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status {
      display: none;
      margin-top: 12px;
      padding: 9px 10px;
      border-radius: 8px;
      background: rgba(248,113,113,.14);
      color: #fecaca;
      font-size: 12px;
      line-height: 1.45;
    }
    .status.show { display: block; }
  </style>
</head>
<body>
  <div class="head">
    <h1>插件盒子</h1>
  </div>
  <div class="grid">
    <button class="tool" type="button" data-tool="links">
      <span class="icon links">L</span>
      <span class="name">链接<br>提取/预览/下载</span>
    </button>
    <button class="tool" type="button" data-tool="images">
      <span class="icon images">↓</span>
      <span class="name">顺序下载<br>（线上作业）</span>
    </button>
    <button class="tool" type="button" data-tool="eval">
      <span class="icon eval">✓</span>
      <span class="name">评测</span>
    </button>
    <button class="tool" type="button" data-tool="weekly">
      <span class="icon weekly">W</span>
      <span class="name">周报工具</span>
    </button>
  </div>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
